<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design Pipeline — Organisation & Member Login Review</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif;
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-900 flex flex-col h-screen overflow-hidden">

  <!-- Switcher Top Bar -->
  <header class="bg-white border-b border-gray-300 px-6 py-2.5 flex flex-wrap items-center justify-between gap-4 shrink-0 shadow-sm z-10">
    <div class="flex items-center gap-3">
      <span class="px-2 py-0.5 border border-gray-900 bg-gray-900 text-white text-[10px] font-bold uppercase tracking-wider rounded">
        Tier 1 · Grayscale Wireframe
      </span>
      <div>
        <h1 class="text-sm font-bold text-gray-900 leading-tight">Syasyah Samaj — Dedicated Organisation Login</h1>
        <p class="text-[11px] text-gray-500">Isolated from Payload Admin (/admin) · Compare 3 Stances</p>
      </div>
    </div>

    <!-- Variant Tabs -->
    <div class="flex items-center gap-1.5 bg-gray-100 p-1 border border-gray-300 rounded-lg text-xs">
      <button
        id="btn-010"
        onclick="switchLoginVariant('010', '../010-org-login-split-desk/index.html')"
        class="tab-btn px-3 py-1.5 font-bold rounded-md bg-white shadow-xs border border-gray-300 text-gray-950"
      >
        010: Split Civic Desk
      </button>
      <button
        id="btn-011"
        onclick="switchLoginVariant('011', '../011-org-login-focused-modal/index.html')"
        class="tab-btn px-3 py-1.5 font-medium rounded-md text-gray-600 hover:text-black"
      >
        011: Focused Trust Card
      </button>
      <button
        id="btn-012"
        onclick="switchLoginVariant('012', '../012-org-login-command-portal/index.html')"
        class="tab-btn px-3 py-1.5 font-medium rounded-md text-gray-600 hover:text-black"
      >
        012: Multi-Portal Hub
      </button>
    </div>

    <div class="flex items-center gap-2">
      <a
        id="openLoginDirectLink"
        href="../010-org-login-split-desk/index.html"
        target="_blank"
        class="text-xs px-3 py-1.5 border border-gray-400 font-semibold rounded hover:bg-gray-50 flex items-center gap-1.5"
      >
        <span>Open standalone</span>
        <span>↗</span>
      </a>
    </div>
  </header>

  <!-- Interactive Preview Frame -->
  <main class="flex-1 w-full bg-gray-200 relative overflow-hidden">
    <iframe
      id="loginPreviewFrame"
      src="../010-org-login-split-desk/index.html"
      class="w-full h-full border-none bg-white"
    ></iframe>
  </main>

  <script>
    function switchLoginVariant(id, url) {
      document.getElementById('loginPreviewFrame').src = url;
      document.getElementById('openLoginDirectLink').href = url;

      document.querySelectorAll('.tab-btn').forEach(b => {
        b.className = 'tab-btn px-3 py-1.5 font-medium rounded-md text-gray-600 hover:text-black';
      });

      const activeBtn = document.getElementById('btn-' + id);
      activeBtn.className = 'tab-btn px-3 py-1.5 font-bold rounded-md bg-white shadow-xs border border-gray-300 text-gray-950';
    }
  </script>
</body>
</html>
