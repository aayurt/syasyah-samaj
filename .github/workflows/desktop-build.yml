name: Build Desktop Apps

on:
  workflow_dispatch:
    inputs:
      remote_url:
        description: >-
          Hosted web build the desktop window loads (Path A). Empty =
          bundle the local web dist instead. Defaults to the prod env.
        required: false
        type: string
  push:
    branches:
      - main
      - Billings
    paths:
      - 'apps/billing/**'
      - 'apps/desktop/**'

env:
  # Prod hosted web build — the desktop window points here so UI updates
  # ship via web deploy. Override per-run via the workflow_dispatch input.
  REMOTE_URL: https://syasyahsamaj.com/app/

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: syasya-accounting-macos
            # .app only by default — DMG needs create-dmg, which isn't on the
            # runner. Add `--dmg` here if you want to install it.
            bundle_args: ''
          - os: windows-latest
            artifact: syasya-accounting-windows
            bundle_args: '--win'

    runs-on: ${{ matrix.os }}

    env:
      # Pinned to match the repo's packageManager field.
      PNPM_VERSION: 10.3.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            apps/billing/pnpm-lock.yaml
            apps/desktop/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install billing dependencies
        run: pnpm --dir apps/billing install --frozen-lockfile

      - name: Install desktop dependencies
        run: pnpm --dir apps/desktop install --frozen-lockfile

      - name: Build web app + desktop bundle
        working-directory: apps/desktop
        # GitHub Actions uses PowerShell on windows runners — the step is
        # bash, so pin the shell explicitly.
        shell: bash
        run: |
          ARGS="${{ matrix.bundle_args }}"
          URL="${{ env.REMOTE_URL }}"
          # A workflow_dispatch input overrides the default prod URL;
          # an empty input means bundle the local dist (no --remote).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.remote_url }}" ]; then
            URL="${{ inputs.remote_url }}"
          fi
          if [ -n "$URL" ]; then
            ARGS="$ARGS --remote $URL"
          fi
          echo ">> pnpm build $ARGS"
          pnpm build $ARGS

      - name: Upload macOS app
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: error

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
