version: '3.8'

services:
  app:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev"
    env_file:
      - .env.local
    expose:
      - "3000"
    depends_on:
      - db

  proxy:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "8443:8443"
      - "443:8443"
      - "8080:8080"
    volumes:
      - ./docker/certs:/etc/nginx/certs:ro
    depends_on:
      - app
      - billing

  billing:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @afno/billing run dev"
    expose:
      - "5173"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: syasyah
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  app_node_modules:
  postgres_data:
